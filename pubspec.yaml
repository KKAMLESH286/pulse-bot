name: track_me
description: "Pulse AI - AI-powered workout tracker"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.2.5
  google_sign_in: ^6.2.2
  # State management (Riverpod 3.0)
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  # Routing
  go_router: ^15.1.2
  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  # UI helpers
  intl: ^0.20.2
  timeago: ^3.7.0
  flutter_markdown: ^0.7.7+1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.0
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  custom_lint:
  riverpod_lint:

flutter_native_splash:
  color: "#121212"
  image: assets/images/splash_logo.png
  color_dark: "#121212"
  image_dark: assets/images/splash_logo.png

  android_12:
    color: "#121212"
    image: assets/images/splash_logo.png
    color_dark: "#121212"
    image_dark: assets/images/splash_logo.png

  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
