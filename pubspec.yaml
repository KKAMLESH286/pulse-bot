name: track_me
description: "GainBot - AI-powered workout tracker"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2
  # State management (Riverpod 3.0)
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  # Routing
  go_router: ^15.1.2
  # UI helpers
  intl: ^0.20.2
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.0
  build_runner: ^2.4.14
  custom_lint:
  riverpod_lint:

flutter:
  uses-material-design: true
